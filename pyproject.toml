[project]
name = "SBDRank"
version = "0.1.0"
description = "Tool to allow powerlifters to see how they stack up against the global powerlifting rankings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional_dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pandas>=2.2",
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbdrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
